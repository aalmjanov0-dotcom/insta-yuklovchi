<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insta Video Yuklovchi - Olimjonov Abdulboriy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffffff 0%, #fff1f5 50%, #ffe4ec 100%);
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .bg-icons {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .insta-float {
      position: absolute;
      color: #ec4899;
      opacity: 0.16;
      filter: drop-shadow(0 6px 14px rgba(236, 72, 153, 0.15));
    }

    .insta-float svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .i1 {
      width: 54px;
      height: 54px;
      top: 12%;
      left: 8%;
      animation: driftOne 16s ease-in-out infinite;
    }

    .i2 {
      width: 42px;
      height: 42px;
      top: 22%;
      right: 12%;
      animation: driftTwo 19s ease-in-out infinite;
    }

    .i3 {
      width: 64px;
      height: 64px;
      bottom: 14%;
      left: 14%;
      animation: driftThree 22s ease-in-out infinite;
    }

    .i4 {
      width: 46px;
      height: 46px;
      bottom: 18%;
      right: 9%;
      animation: driftOne 18s ease-in-out infinite reverse;
    }

    .i5 {
      width: 38px;
      height: 38px;
      top: 52%;
      left: 5%;
      animation: driftTwo 15s ease-in-out infinite;
    }

    .i6 {
      width: 50px;
      height: 50px;
      top: 64%;
      right: 18%;
      animation: driftThree 20s ease-in-out infinite reverse;
    }

    @keyframes driftOne {
      0% { transform: translate(0px, 0px) rotate(0deg); }
      50% { transform: translate(45px, -30px) rotate(180deg); }
      100% { transform: translate(0px, 0px) rotate(360deg); }
    }

    @keyframes driftTwo {
      0% { transform: translate(0px, 0px) rotate(0deg); }
      50% { transform: translate(-50px, 35px) rotate(-180deg); }
      100% { transform: translate(0px, 0px) rotate(-360deg); }
    }

    @keyframes driftThree {
      0% { transform: translate(0px, 0px) rotate(0deg); }
      50% { transform: translate(35px, 40px) rotate(180deg); }
      100% { transform: translate(0px, 0px) rotate(360deg); }
    }

    .author-header {
      position: fixed;
      top: 18px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #db2777;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      z-index: 2;
    }

    .box {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 34px 28px;
      border-radius: 22px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      border: 1.5px solid #fbcfe8;
      box-shadow: 0 16px 40px rgba(244, 114, 182, 0.18);
    }

    h1 {
      color: #db2777;
      margin-bottom: 10px;
      font-size: 25px;
      font-weight: 700;
    }

    p {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1.5px solid #f9a8d4;
      background: #fffafa;
      color: #1f2937;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
      color: #9ca3af;
    }

    input:focus {
      border-color: #ec4899;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.15);
    }

    button {
      padding: 13px 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #f472b6, #db2777);
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(219, 39, 119, 0.25);
      transition: transform 0.15s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(219, 39, 119, 0.35);
    }

    button:active {
      transform: translateY(0);
    }

    #natija {
      margin-top: 18px;
      font-size: 14px;
      font-weight: 500;
      color: #be185d;
      word-break: break-all;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="bg-icons" aria-hidden="true">
    <div class="insta-float i1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
        <circle cx="12" cy="12" r="4"></circle>
        <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"></circle>
      </svg>
    </div>
    <div class="insta-float i2">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
        <circle cx="12" cy="12" r="4"></circle>
        <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"></circle>
      </svg>
    </div>
    <div class="insta-float i3">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
        <circle cx="12" cy="12" r="4"></circle>
        <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"></circle>
      </svg>
    </div>
    <div class="insta-float i4">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
        <circle cx="12" cy="12" r="4"></circle>
        <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"></circle>
      </svg>
    </div>
    <div class="insta-float i5">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
        <circle cx="12" cy="12" r="4"></circle>
        <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"></circle>
      </svg>
    </div>
    <div class="insta-float i6">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
        <circle cx="12" cy="12" r="4"></circle>
        <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"></circle>
      </svg>
    </div>
  </div>

  <div class="author-header">Olimjonov Abdulboriy</div>

  <div class="box">
    <h1>Insta Video Yuklovchi</h1>
    <p>Instagram video yoki Reels havolasini kiriting</p>
    <div class="row">
      <input type="text" id="linkInput" placeholder="https://www.instagram.com/reel/...">
      <button onclick="tekshir()">Yuklash</button>
    </div>
    <div id="natija"></div>
  </div>

  <script>
    async function tekshir() {
      const link = document.getElementById("linkInput").value.trim();
      const natija = document.getElementById("natija");

      if (!link) {
        natija.style.color = "#e11d48";
        natija.innerText = "Avval Instagram havolasini kiriting!";
        return;
      }

      natija.style.color = "#db2777";
      natija.innerText = "Video tayyorlanmoqda, biroz kuting...";

      try {
        const res = await fetch("/download", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: link })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          natija.style.color = "#e11d48";
          natija.innerText = errData.error || "Videoni olishda xatolik yuz berdi.";
          return;
        }

        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "instagram_video.mp4";
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);

        natija.style.color = "#16a34a";
        natija.innerText = "Tayyor! Video yuklab olindi.";
      } catch (err) {
        natija.style.color = "#e11d48";
        natija.innerText = "Serverga ulanib bo‘lmadi. app.py ishlayotganini tekshiring.";
      }
    }
  </script>
</body>
</html>
